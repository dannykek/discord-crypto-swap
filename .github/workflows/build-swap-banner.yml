name: Build clean animated swap banner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-swap-banner.yml'
      - 'scripts/generate-panel-gif.py'
      - 'src/assets/panel/swap-banner.jpg'

permissions:
  contents: write

jobs:
  generate-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Create the smooth GIF from existing banner
        run: python scripts/generate-panel-gif.py
      - name: Commit only the generated banner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/panel/swap-banner.gif
          if ! git diff --cached --quiet; then
            git commit -m 'Build clean smooth swap banner GIF'
            git push origin HEAD:main
          fi
